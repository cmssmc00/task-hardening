[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-hardening"
version = "0.1.0"
description = "Make program-writing tasks for terminal agents harder without making them unfair: gates, controls, frozen references, failure review."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mingshi Chen"}]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
example = ["numpy>=1.24"]
test = ["pytest"]

[tool.setuptools]
packages = ["hardening"]
